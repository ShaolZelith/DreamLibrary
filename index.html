

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Library</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="loginPage">
    <section id="loginPanel" class="panel">
      <h2 id="loginTitle">Accès à Dream Library</h2>
      <form id="loginForm">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password">
        <button type="submit">Déverrouiller</button>
        <button type="button" id="cancelLogin">Annuler</button>
      </form>
      <p id="loginMessage" role="status"></p>
    </section>
  </main>

  <div id="appContent" class="hidden">
    <header class="header">
      <div>
        <h1>📚 Dream Library</h1>
        <p>Ma bibliothèque, mes histoires.</p>
      </div>
      <div class="header-actions">
        <button id="editModeButton">Passer en mode édition</button>
        <button type="button" id="logoutButton">Se déconnecter</button>
      </div>
    </header>

    <main>
      <section id="editorPanel" class="panel hidden">
        <div class="editor-heading">
          <h2 id="formTitle">Ajouter une œuvre</h2>
          <button type="button" id="toggleEditorButton">Masquer le formulaire</button>
        </div>
        <form id="workForm">
          <input id="workId" type="hidden">

          <label for="title">Titre *</label>
          <input id="title" required maxlength="300">

          <label for="authorSelect">Associer un auteur existant</label>
          <div class="author-entry">
            <select id="authorSelect">
              <option value="">Choisir un auteur…</option>
            </select>
            <input id="existingAuthorRole" maxlength="80" value="author" aria-label="Rôle de l’auteur associé" placeholder="Rôle">
            <button type="button" id="addExistingAuthor">Associer</button>
          </div>

          <label for="newAuthorName">Ou créer un auteur</label>
          <div class="author-entry author-entry--new">
            <input id="newAuthorName" maxlength="300" placeholder="Nom de l’auteur">
            <input id="newAuthorRole" maxlength="80" value="author" aria-label="Rôle de l’auteur" placeholder="Rôle">
            <button type="button" id="addNewAuthor">Ajouter</button>
          </div>
          <div id="selectedAuthors" class="selected-authors" aria-live="polite"></div>
          <p id="authorStatus" class="field-status" role="status"></p>

          <label for="coverUrl">URL de la couverture</label>
          <input id="coverUrl" type="url">

          <label for="summary">Résumé</label>
          <textarea id="summary" rows="4"></textarea>

          <label for="originalLanguage">Langue originale</label>
          <input id="originalLanguage" maxlength="100">

          <label for="workType">Type d’œuvre</label>
          <input id="workType" maxlength="100">

          <label class="check">
            <input id="isPriority" type="checkbox"> Prioritaire
          </label>

          <div class="actions">
            <button type="submit">Enregistrer l’œuvre</button>
            <button type="button" id="resetForm">Annuler</button>
          </div>
        </form>
      </section>

      <section class="library">
        <div class="library-heading">
          <h2>Mes œuvres</h2>
          <span id="workCount">0 œuvre</span>
        </div>

        <div class="filters">
          <input id="search" type="search" placeholder="Rechercher une œuvre ou un auteur…">

          <select id="workTypeFilter">
            <option value="all">Tous les types d’œuvre</option>
          </select>

          <select id="priorityFilter">
            <option value="all">Toutes les priorités</option>
            <option value="true">Prioritaires</option>
            <option value="false">Non prioritaires</option>
          </select>
        </div>

        <p id="statusMessage" role="status">Chargement de la bibliothèque…</p>
        <div id="workGrid" class="book-grid"></div>
      </section>
    </main>

    <footer>
      <p>Dream Library · Une bibliothèque à partager</p>
    </footer>
  </div>

  <script src="./script.js" defer></script>
</body>
</html>

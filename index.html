

<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dream Library</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="loginPage">
    <section id="loginPanel" class="panel">
      <h2 id="loginTitle">Accès à Dream Library</h2>
      <form id="loginForm">
        <label for="password">Mot de passe</label>
        <input id="password" type="password" required autocomplete="current-password">
        <button type="submit">Déverrouiller</button>
        <button type="button" id="cancelLogin">Annuler</button>
      </form>
      <p id="loginMessage" role="status"></p>
    </section>
  </main>

  <div id="appContent" class="hidden">
    <header class="header">
      <div>
        <h1>📚 Dream Library</h1>
        <p>Ma bibliothèque, mes histoires.</p>
      </div>
      <div class="header-actions">
        <button id="editModeButton">Passer en mode édition</button>
        <button type="button" id="logoutButton">Se déconnecter</button>
      </div>
    </header>

    <main>
      <section class="library">
        <div class="library-heading">
          <h2>Mes œuvres</h2>
          <div class="library-heading-actions">
            <span id="workCount">0 œuvre</span>
            <button type="button" id="addWorkButton" class="hidden">Ajouter un livre</button>
          </div>
        </div>

        <div class="filters">
          <input id="search" type="search" placeholder="Rechercher une œuvre ou un auteur…">

          <select id="workTypeFilter">
            <option value="all">Tous les types d’œuvre</option>
          </select>

          <select id="priorityFilter">
            <option value="all">Toutes les priorités</option>
            <option value="true">Prioritaires</option>
            <option value="false">Non prioritaires</option>
          </select>
        </div>

        <p id="statusMessage" role="status">Chargement de la bibliothèque…</p>
        <div id="workGrid" class="book-grid"></div>
        <section id="workDetails" class="work-details hidden" aria-live="polite"></section>
      </section>
    </main>

    <footer>
      <p>Dream Library · Une bibliothèque à partager</p>
    </footer>
  </div>

  <template id="workEditorTemplate">
    <form id="workForm" class="work-editor-form">
      <input id="workId" type="hidden">

      <section class="editor-section">
        <h3>Informations générales</h3>
        <label for="title">Titre *</label>
        <input id="title" required maxlength="300">

        <label for="coverUrl">URL de couverture</label>
        <input id="coverUrl" type="url">

        <label for="summary">Résumé</label>
        <textarea id="summary" rows="7"></textarea>

        <div class="editor-field-grid">
          <div>
            <label for="originalLanguage">Langue originale</label>
            <input id="originalLanguage" maxlength="100">
          </div>
          <div>
            <label for="workType">Type d’œuvre</label>
            <input id="workType" maxlength="100">
          </div>
        </div>

        <label class="check">
          <input id="isPriority" type="checkbox"> Prioritaire
        </label>

        <fieldset class="status-fields">
          <legend>Possession</legend>
          <label class="check"><input id="is_owned" type="checkbox"> Possédé</label>
          <label class="check"><input id="is_not_owned" type="checkbox"> Non possédé</label>
        </fieldset>

        <fieldset class="status-fields">
          <legend>Lecture</legend>
          <label class="check"><input id="is_read" type="checkbox"> Lu</label>
          <label class="check"><input id="is_not_read" type="checkbox"> Non lu</label>
        </fieldset>
      </section>

      <section class="editor-section">
        <h3>Auteurs</h3>
        <label for="authorSelect">Associer un auteur existant</label>
        <div class="author-entry">
          <select id="authorSelect"><option value="">Choisir un auteur…</option></select>
          <button type="button" id="addExistingAuthor">Associer</button>
        </div>
        <label for="newAuthorName">Créer un auteur</label>
        <div class="author-entry">
          <input id="newAuthorName" maxlength="300" placeholder="Nom de l’auteur">
          <button type="button" id="addNewAuthor">Ajouter</button>
        </div>
        <div id="selectedAuthors" class="selected-authors" aria-live="polite"></div>
        <p id="authorStatus" class="field-status" role="status"></p>
      </section>

      <section class="editor-section">
        <h3>Tags et catégories</h3>
        <label for="tagSelect">Associer un tag existant</label>
        <div class="author-entry">
          <select id="tagSelect"><option value="">Choisir un tag…</option></select>
          <button type="button" id="addWorkTag">Associer</button>
        </div>
        <div id="selectedTags" class="selected-authors" aria-live="polite"></div>
        <label for="newTagName">Créer un tag</label>
        <div class="tag-create-entry">
          <input id="newTagName" placeholder="Nom du tag">
          <select id="newTagCategory" aria-label="Catégorie du nouveau tag">
            <option value="">Choisir une catégorie…</option>
            <option value="genre">Genre</option>
            <option value="theme">Thème</option>
            <option value="place">Lieu</option>
            <option value="period">Période</option>
          </select>
          <button type="button" id="createWorkTag">Ajouter</button>
        </div>
        <p id="tagStatus" class="field-status" role="status"></p>
      </section>

      <p id="editorMessage" class="editor-message" role="status"></p>
      <div class="detail-actions">
        <button type="submit" id="saveWorkButton">Enregistrer le livre</button>
        <button type="button" id="cancelWorkEditButton" class="secondary-button">Annuler</button>
      </div>
    </form>
  </template>

  <script src="./script.js" defer></script>
</body>
</html>
